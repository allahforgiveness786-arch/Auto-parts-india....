name: Build React Native Android APK

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Free up disk space on GitHub Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android/ndk/25.*
          sudo rm -rf /usr/local/lib/android/ndk/24.*
          sudo rm -rf /usr/local/lib/android/ndk/23.*
          sudo rm -rf /usr/local/lib/android/ndk/22.*
          sudo rm -rf /usr/local/lib/android/ndk/21.*
          df -h

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "zulu"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android settings.gradle
        run: |
          mkdir -p react-native-app/android
          if [ ! -f "react-native-app/android/settings.gradle" ]; then
            echo "Generating clean settings.gradle..."
            cat << 'EOF' > react-native-app/android/settings.gradle
          pluginManagement {
              includeBuild("../node_modules/@react-native/gradle-plugin")
          }
          plugins { id("com.facebook.react.settings") }
          extensions.configure(com.facebook.react.ReactSettingsExtension){ it.autolinkLibrariesFromCommand() }
          rootProject.name = 'AutoPartsIndia'
          include ':app'
          includeBuild("../node_modules/@react-native/gradle-plugin")
          EOF
          fi

      - name: Install React Native Dependencies
        run: |
          cd react-native-app
          npm install --legacy-peer-deps

      - name: Patch Firebase CMakeLists for RN 0.76 Compatibility
        run: |
          cd react-native-app
          find node_modules/@react-native-firebase -name CMakeLists.txt -exec sed -i 's/target_compile_reactnative_options(\(.*\) PRIVATE)/target_compile_options(\1 PRIVATE -fexceptions -frtti -std=c++20 -Wall)/g' {} +


      - name: Prepare Clean Asset Directories
        run: |
          cd react-native-app
          rm -rf android/app/src/main/assets/index.android.bundle || true
          rm -rf android/app/src/main/assets/fonts || true
          mkdir -p android/app/src/main/assets

      - name: Generate App Icons
        run: |
          if [ -f "generate-app-icons.js" ]; then
            npm install sharp || true
            node generate-app-icons.js || true
          fi

      - name: Ensure Gradle Wrapper & Executable
        run: |
          cd react-native-app/android
          echo "Force downloading official gradle-wrapper.jar..."
          mkdir -p gradle/wrapper
          wget -qO gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.8.0/gradle/wrapper/gradle-wrapper.jar || \
          curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v8.8.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew || true
          sed -i 's/\r$//' gradlew || true

      - name: Ensure google-services.json
        env:
          GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          cd react-native-app/android/app
          if [ -n "$GOOGLE_SERVICES_JSON_SECRET" ]; then
            echo "Using google-services.json from GitHub Secrets..."
            echo "$GOOGLE_SERVICES_JSON_SECRET" > google-services.json
          elif [ ! -f "google-services.json" ]; then
            echo "google-services.json is missing, embedding exact project configuration..."
            cat << 'EOF' > google-services.json
          {
            "project_info": {
              "project_number": "751764116522",
              "firebase_url": "https://auto-parts-market-place-20312-default-rtdb.firebaseio.com",
              "project_id": "auto-parts-market-place-20312",
              "storage_bucket": "auto-parts-market-place-20312.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:751764116522:android:f4705ee3aed7aa197adf53",
                  "android_client_info": {
                    "package_name": "com.autoparts.app"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "751764116522-oc4lurqs2fflbr5fdanlq32343if1e5k.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.autoparts.app",
                      "certificate_hash": "14d6a60e48069f67ccfaa47241797b95d9b5689a"
                    }
                  },
                  {
                    "client_id": "751764116522-gr59kobj3c3i1hsgr5hiumauk5otr5sq.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyBTfivYbxE7PDB7FxyAlJjFDid6LKPplx8"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "751764116522-gr59kobj3c3i1hsgr5hiumauk5otr5sq.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:751764116522:android:96d83dd190f393417adf53",
                  "android_client_info": {
                    "package_name": "com.autoparts.india"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "751764116522-gr59kobj3c3i1hsgr5hiumauk5otr5sq.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyBTfivYbxE7PDB7FxyAlJjFDid6LKPplx8"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "751764116522-gr59kobj3c3i1hsgr5hiumauk5otr5sq.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:751764116522:android:4244dc4b7a8150f77adf53",
                  "android_client_info": {
                    "package_name": "com.autopartsindia"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "751764116522-gr59kobj3c3i1hsgr5hiumauk5otr5sq.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyBTfivYbxE7PDB7FxyAlJjFDid6LKPplx8"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "751764116522-gr59kobj3c3i1hsgr5hiumauk5otr5sq.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          else
            echo "google-services.json is already present."
          fi

      - name: Ensure Debug Keystore
        run: |
          cd react-native-app/android/app
          if [ ! -f "debug.keystore" ]; then
            echo "debug.keystore is missing. Auto-generating development signing key..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -storetype PKCS12
          else
            echo "debug.keystore is already present."
          fi

      - name: Create Swap File to Prevent Out of Memory
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 2G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=2048
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Clean Gradle and Rebuild Environment (Strict No-Cache)
        run: |
          cd react-native-app/android
          chmod +x ./gradlew || true
          rm -rf app/build || true
          rm -rf build || true
          rm -rf .gradle || true
          rm -rf ~/.gradle/caches || true
          rm -rf ~/.gradle/daemon || true
          ./gradlew --stop || true
          ./gradlew clean --no-daemon --no-build-cache || true

      - name: Setup Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125"

      - name: Build React Native Android Release APK (Strict Clean Build)
        env:
          CI: true
          REACT_NATIVE_MAX_WORKERS: 1
          CMAKE_BUILD_PARALLEL_LEVEL: 1
          NINJA_STATUS: "[%f/%c] "
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/26.1.10909125
        run: |
          cd react-native-app/android
          chmod +x ./gradlew || true
          ./gradlew assembleRelease --console=plain --stacktrace \
          -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC"

      - name: Build React Native Android Debug APK (Strict Clean Build)
        env:
          CI: true
          REACT_NATIVE_MAX_WORKERS: 1
          CMAKE_BUILD_PARALLEL_LEVEL: 1
          NINJA_STATUS: "[%f/%c] "
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/26.1.10909125
        run: |
          cd react-native-app/android
          chmod +x ./gradlew || true
          ./gradlew assembleDebug --console=plain --stacktrace \
          -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-native-release-apk
          path: react-native-app/android/app/build/outputs/apk/release/*.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-native-debug-apk
          path: react-native-app/android/app/build/outputs/apk/debug/*.apk
